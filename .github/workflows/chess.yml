name: CRT Chess Engine

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-chess:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'chess|')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-chess
        run: pip install chess

      - name: Run chess engine
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python .github/scripts/chess_engine.py "init"
          else
            python .github/scripts/chess_engine.py "${{ github.event.issue.title }}"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "CRT Chess Bot"
          git config --global user.email "actions@github.com"
          git add chess_state.fen chess-board.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "♟️ Chess move updated" && git push)

      - name: Close Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "♟️ Move processed! Check the updated CRT board on the profile README."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
