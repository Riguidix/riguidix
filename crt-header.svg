<svg fill="none" viewBox="0 0 850 380" width="850" height="380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0, 0, 0, 0.35)" />
    </pattern>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bezel { fill: #1a1d1a; stroke: #2c332c; stroke-width: 4; }
    .screen { fill: #080c08; stroke: #143d14; stroke-width: 2; }
    .text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #33ff33; filter: url(#glow); }
    .dim { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #1c8c1c; }
    .bold { font-weight: bold; fill: #66ff66; }
    .cursor { fill: #33ff33; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  
  <rect x="10" y="10" width="830" height="360" rx="22" class="bezel" />
  
  <rect x="30" y="30" width="790" height="305" rx="12" class="screen" />

  
  <circle cx="795" cy="352" r="5" fill="#33ff33" filter="url(#glow)" />
  <text x="690" y="356" font-family="monospace" font-size="11" fill="#556655">RIGUIDIX-CRT // 1999</text>

  
  <text x="55" y="65" class="text"><tspan class="bold">riguidix@github</tspan>:<tspan class="dim">~$</tspan> neofetch --crt</text>

  
  <text x="55" y="105" class="text" xml:space="preserve">       /\       </text>
  <text x="55" y="125" class="text" xml:space="preserve">      /  \      </text>
  <text x="55" y="145" class="text" xml:space="preserve">     / /\ \     </text>
  <text x="55" y="165" class="text" xml:space="preserve">    / /  \ \    </text>
  <text x="55" y="185" class="text" xml:space="preserve">   / /____\ \   </text>
  <text x="55" y="205" class="text" xml:space="preserve">  /__________\  </text>
  <text x="55" y="235" class="dim" xml:space="preserve">  [EVERGREEN OS]</text>

  
  <text x="240" y="105" class="text"><tspan class="bold">USER</tspan>      :: Riguidix (Full-Stack Developer)</text>
  <text x="240" y="125" class="dim">------------------------------------------------------</text>
  <text x="240" y="148" class="text"><tspan class="bold">BUILDING</tspan>  :: Online Board Game (React + Redux + Konva)</text>
  <text x="240" y="170" class="text"><tspan class="bold">FRONTEND</tspan>  :: React, Vue, TailwindCSS, Vite, JS</text>
  <text x="240" y="192" class="text"><tspan class="bold">BACKEND</tspan>   :: C#, .NET 8, Node.js, SQL Server, Docker</text>
  <text x="240" y="214" class="text"><tspan class="bold">LEARNING</tspan>  :: Backend Arch, Korean 🇰🇷 &amp; Life ☕</text>
  <text x="240" y="236" class="text"><tspan class="bold">HOBBIES</tspan>   :: Chess ♟️, Math Puzzles &amp; Board Games</text>

  
  <text x="55" y="285" class="text"><tspan class="bold">riguidix@github</tspan>:<tspan class="dim">~$</tspan> ./start_chess_server.sh --theme=phosphor</text>
  <text x="55" y="308" class="dim">[OK] Listening for visitor moves below...</text>
  <rect x="400" y="295" width="9" height="16" class="cursor" />

  
  <rect x="30" y="30" width="790" height="305" rx="12" fill="url(#scanlines)" pointer-events="none" />
</svg>
