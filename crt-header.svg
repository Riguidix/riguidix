    .dim { font-family: 'Courier New', Courier, monospace; font-size: 13.5px; fill: #1c8c1c; }
    .bold { font-weight: bold; fill: #66ff66; }
    .cursor { fill: #33ff33; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  
